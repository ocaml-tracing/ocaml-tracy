name: build
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run:
    name: build
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        container:
          - ghcr.io/c-cube/c-cube-commmon/ci-4.14:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: recursive
    - run: opam pin -n .
    - run: apt update && opam install . -t --deps-only
    - run: opam exec -- dune build @install -p tracy-client
    - run: opam install containers
    - run: N=2 TRACY_NO_INVARIANT_CHECK=1 opam exec -- dune exec ./examples/prof1.exe
